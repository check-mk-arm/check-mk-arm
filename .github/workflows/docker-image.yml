name: docker-image

# Wraps a released arm64 package into a runnable image and pushes it to GHCR.
#
# The package comes from the GitHub release, not from the build job's artifact.
# That is deliberate — it exercises the same path a user takes, so a release
# whose assets are missing or corrupt fails here rather than in somebody's
# `docker build`. The consequence is that this cannot run on a plain branch
# push, since a push produces no release; image changes are only exercised by a
# run that releases.
#
# `gh release download` is used rather than a plain curl because it works for
# draft releases too, whose assets have no public URL yet.

on:
  workflow_call:
    inputs:
      version:
        description: "Checkmk version whose release supplies the package"
        required: true
        type: string
      image_name:
        description: "Image name under ghcr.io/<owner>/ (default: version.sh's)"
        default: ""
        type: string

jobs:
  image:
    # arm64: the package is arm64, so the image has to be built on it.
    runs-on: ubuntu-24.04-arm
    permissions:
      # `write` to also download draft releases, which are not public and therefore
      # not available with read only permissions.
      contents: write # to download the release asset, including drafts
      packages: write # to push to GHCR

    steps:
      - uses: actions/checkout@v4

      - name: Fetch the package from the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$VERSION" =~ ^2\.[0-9]+\.[0-9]+p[0-9]+$ ]] ||
            { echo "::error::'$VERSION' is not a Checkmk version"; exit 1; }
          # A glob, not a constructed filename: the distro is encoded in the
          # .deb's name and version.sh reads it back out of there. Building the
          # name here would mean keeping a second copy of that mapping.
          gh release download "$VERSION" \
            --pattern 'check-mk-raw-*_arm64.deb' \
            --pattern 'check-mk-raw-*_arm64.deb.sha256' \
            --dir docker/
          # The reason the .sha256 is published beside the .deb. A release asset
          # is the one build output that travels, so check it before trusting it.
          ( cd docker && sha256sum -c ./*.deb.sha256 )

      - name: Resolve the image tags
        env:
          VERSION: ${{ inputs.version }}
          IMAGE_NAME_INPUT: ${{ inputs.image_name }}
        run: |
          # GIT_TAG makes version.sh assert that the .deb actually is the
          # version this run claims to publish, rather than whatever asset the
          # release happened to carry.
          cd docker
          export GIT_TAG="$VERSION"
          # shellcheck disable=SC1091
          . ./version.sh
          [ -n "${IMAGE_NAME_INPUT:-}" ] && IMAGE_NAME="$IMAGE_NAME_INPUT"
          # GHCR rejects uppercase in a repository name, and an owner may have it.
          owner=$(tr '[:upper:]' '[:lower:]' <<<"${GITHUB_REPOSITORY_OWNER}")
          {
            echo "CMK_VERSION=$CMK_VERSION"
            echo "DISTRO_CODE=$DISTRO_CODE"
            echo "IMAGE=ghcr.io/$owner/$IMAGE_NAME"
            echo "IMAGE_TAGS=$IMAGE_TAGS"
          } >> "$GITHUB_ENV"
          echo "will publish ghcr.io/$owner/$IMAGE_NAME with tags: $IMAGE_TAGS"

      - name: Build the image
        run: |
          args=()
          for t in $IMAGE_TAGS; do args+=(-t "$IMAGE:$t"); done
          docker build docker/ \
            --build-arg "DISTRO_CODE=$DISTRO_CODE" \
            --build-arg "CMK_VERSION=$CMK_VERSION" \
            --pull --no-cache \
            "${args[@]}"

      # The Dockerfile already gates on `omd version` at build time. This checks
      # the built image instead: that the entrypoint survived, that the services
      # it starts are installed, and that the whole thing is really arm64.
      - name: Smoke test the image
        run: |
          primary="$IMAGE:${IMAGE_TAGS%% *}"
          docker run --rm --entrypoint omd "$primary" version
          docker run --rm --entrypoint dpkg "$primary" --print-architecture |
            grep -qx arm64 || { echo "::error::image is not arm64"; exit 1; }
          docker run --rm --entrypoint bash "$primary" -c '
            set -e
            test -x /docker-entrypoint.sh
            command -v xinetd >/dev/null
            command -v cron >/dev/null'

      - name: Push to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$GH_TOKEN" |
            docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          for t in $IMAGE_TAGS; do docker push "$IMAGE:$t"; done
          {
            echo "### Image"
            echo
            echo '```'
            for t in $IMAGE_TAGS; do echo "docker pull $IMAGE:$t"; done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
