name: build-deb

# Builds the arm64 Checkmk package on GitHub's free 4-vCPU arm64 runner.
#
#   push to ci/**       build and keep the package as a workflow artifact
#   workflow_dispatch   build any version, and optionally cut the release
#
# The release is made *by* a green build rather than the other way round: a
# build takes hours, so a release published up front would sit there empty for
# all of them and stay empty if the build failed. Here the tag is created only
# once a package exists and has passed ci/verify-deb.sh, and it points at the
# exact commit that produced it.
#
# A cold build is hours long and needs no cache: see README.md for the measured
# cost and why caching the 8.5 GB Bazel tree is not worth it.

on:
  push:
    branches: ["ci/**"]
  workflow_dispatch:
    inputs:
      version:
        description: "Checkmk version, e.g. 2.4.0p35"
        required: true
        default: "2.4.0p35"
      release:
        description: "Release the package if the build passes"
        type: choice
        default: "no"
        options:
          - "no" # artifact only
          - draft # create the release as a draft, to publish by hand
          - publish # create and publish it

permissions:
  contents: write # to create the release and its tag

concurrency:
  # Two dispatches for different versions are different work, so key on the
  # version as well as the ref. Never cancel a run that may cut a release; a
  # superseded branch push is worth cancelling rather than burning another few
  # hours of runner on a stale commit.
  group: build-deb-${{ github.ref }}-${{ github.event.inputs.version || 'default' }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 350 # the hard cap is 360
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    env:
      # Used when nothing else supplies a version, i.e. a push to ci/**.
      DEFAULT_VERSION: "2.4.0p35"
      # The runner has 16 GB against the build box's 23 GB. Peak measured RSS is
      # 5.3 GiB, so this is headroom, not a budget.
      MEMORY: 13g

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false


      - name: Resolve the build environment
        id: resolve
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          v="${INPUT_VERSION:-$DEFAULT_VERSION}"
          # Also the gate that stops an odd input reaching a shell below, and
          # that catches a typo before it costs a few hours of runner.
          [[ "$v" =~ ^2\.[0-9]+\.[0-9]+p[0-9]+$ ]] ||
            { echo "::error::'$v' is not a Checkmk version like 2.4.0p35"; exit 1; }
          echo "CMK_VERSION=$v" >> "$GITHUB_ENV"
          # A job output as well, because $GITHUB_ENV does not cross job
          # boundaries and the docker-image job needs the resolved version.
          echo "version=$v" >> "$GITHUB_OUTPUT"
          # The runner has no /data; keep the whole build under the runner's own
          # scratch space, which is on the large root filesystem.
          echo "CMK_DATA=$RUNNER_TEMP/cmk" >> "$GITHUB_ENV"
          echo "building Checkmk $v under $RUNNER_TEMP/cmk"

      - name: Runner capacity
        run: |
          nproc
          free -h
          df -h /
          docker version --format '{{.Server.Version}}'

      # ~25 GB is needed against ~46 GB free, so this is insurance rather than a
      # necessity — but finding out at hour two is expensive.
      - name: Reclaim runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/powershell /usr/share/swift || true
          docker image prune -af || true
          df -h /

      - name: Build the builder image
        run: ./run.sh image

      - name: Start the build container
        run: ./run.sh up

      # The long one. `watch` has no place in a single CI job, so disk is simply
      # reported around this step instead.
      - name: Build the package
        run: ./run.sh build

      - name: Build state and disk
        if: always()
        run: |
          df -h /
          ./run.sh status || true

      - name: Verify the package
        run: ./ci/verify-deb.sh

      - name: Upload the package as an artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: check-mk-raw-${{ env.CMK_VERSION }}_arm64
          path: ${{ env.CMK_DATA }}/work/${{ env.CMK_VERSION }}/debs/*
          if-no-files-found: error

      - name: Upload the build logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-logs-${{ env.CMK_VERSION }}
          path: ${{ env.CMK_DATA }}/work/${{ env.CMK_VERSION }}/logs/
          if-no-files-found: warn

      # Reached only by a build that has passed verification. The whole debs/
      # directory goes up because the .sha256 has to be there beside the .deb:
      # checkmk_build's pipeline fetches ${DEB_URL}.sha256 and pipes it through
      # `sha256sum -c -`.
      - name: Release the package
        if: inputs.release == 'draft' || inputs.release == 'publish'
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ inputs.release }}
        run: |
          debs="$CMK_DATA/work/$CMK_VERSION/debs"
          # Re-running a version that already has a release replaces its
          # assets rather than failing at the very end of a long build.
          if gh release view "$CMK_VERSION" >/dev/null 2>&1; then
            echo "release $CMK_VERSION already exists — replacing its assets"
            gh release upload "$CMK_VERSION" --clobber "$debs"/*
            exit 0
          fi
          opts=(--target "$GITHUB_SHA")
          if [ "$MODE" = draft ]; then opts+=(--draft); fi
          gh release create "$CMK_VERSION" "${opts[@]}" \
            --title "Checkmk $CMK_VERSION (arm64)" \
            --notes "Unofficial arm64 build of Checkmk $CMK_VERSION, built from source by \`.github/workflows/build-deb.yml\`. Not supported or endorsed by Checkmk." \
            "$debs"/*

  # Only on a release run: the image is built from the release asset, so there
  # is nothing for it to fetch otherwise. See docker-image.yml.
  image:
    needs: build
    if: inputs.release == 'draft' || inputs.release == 'publish'
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/docker-image.yml
    with:
      version: ${{ needs.build.outputs.version }}
